name: ci-cd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/backend/Healthcare.PatientManagement.sln

      - name: Build
        run: dotnet build src/backend/Healthcare.PatientManagement.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend/Healthcare.PatientManagement.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        working-directory: src/frontend
        run: npm install

      - name: Build
        working-directory: src/frontend
        run: npm run build
